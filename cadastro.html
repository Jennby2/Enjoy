<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <div class="ficha-container">
    <div class="motivacional">Crie sua conta e complete sua ficha para um acompanhamento personalizado!</div>
    
    <h2>Registro</h2>
    <form id="registerForm">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" required placeholder="Escolha um nome de usuário">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required placeholder="Crie uma senha">
      <button type="submit" id="btnRegistrar">Continuar</button>
      <div id="feedbackRegistro"></div>
    </form>

    </div>
  </div>
  <script src="cadastro.js"></script>
</body>

</html>
