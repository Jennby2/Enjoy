<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil do Usuário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <div class="ficha-container">
    <div class="motivacional">Seu perfil e progresso!</div>
    <h2>Perfil</h2>
    <div id="perfilDados"></div>
    <button onclick="window.location.assign('rotina.html')">Ir para Rotina</button>
  </div>
  <div id="fichaContent">
    <h2>Ficha do Usuário</h2>
    <form id="fichaForm" enctype="multipart/form-data">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required placeholder="Digite seu nome">

      <label for="genero">Gênero</label>
      <select id="genero" required>
        <option value="">Selecione o gênero</option>
        <option>Feminino</option>
        <option>Masculino</option>
        <option>Outro</option>
      </select>

      <label for="dataNascimento">Data de Nascimento</label>
      <input type="date" id="dataNascimento" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" required placeholder="Digite seu e-mail">

      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" step="0.1" min="1" required placeholder="Ex: 70.5">

      <label for="altura">Altura (cm)</label>
      <input type="number" id="altura" step="0.1" min="30" required placeholder="Ex: 170">

      <label for="objetivo">Objetivo</label>
      <select id="objetivo" required>
        <option value="">Selecione o objetivo</option>
        <option>Emagrecer</option>
        <option>Ganhar Massa</option>
        <option>Saúde</option>
        <option>Outro</option>
      </select>

      <label for="fotoPerfil">Foto de Perfil</label>
      <input type="file" id="fotoPerfil" accept="image/*">
      <div id="fotoPreview"></div>

      <button type="submit" id="btnSalvar">Salvar Ficha</button>
      <div id="feedbackFicha"></div>
    </form>
  </div>
  <script src="perfil.js"></script>
 <script src="cadastro.js"></script>
</body>
</html>
