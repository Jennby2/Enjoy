<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="registro.css">
</head>
<body>
  <div class="ficha-container">
    <div class="motivacional">Crie sua conta para começar!</div>
    <h2>Registro</h2>
    <form id="registerForm">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" required placeholder="Escolha um nome de usuário">

      <label for="senha">Senha</label>
      <input type="password" id="senha" required placeholder="Crie uma senha">

      <button type="submit" class="btn-cadastro-ficha">Registrar</button>
    </form>
  </div>

  <script src="registro.js"></script>

</body>
</html>
